name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mangrove-classification .

      - name: Verify script imports
        run: docker run --rm --entrypoint python3 mangrove-classification -c "import Script; print('All imports OK')"
